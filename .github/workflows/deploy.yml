name: deploy

# Deploy the desk Worker to its four hosts — desk, issues, claims and prs
# .bounded.tools (#7). One Worker, one deploy; the hostname picks the page.
#
# NO STORED CLOUDFLARE CREDENTIAL. The token is minted per run from the OIDC broker's
# /deploy/desk tier, which pins this workflow ref, this owner, this audience and this
# environment. Nothing here holds a Cloudflare key, and none exists between runs.
#
# THE FIRST DEPLOY ATTACHES THE CUSTOM DOMAIN, and that is the run most likely to fail
# in a way later runs cannot reproduce: a first attach preflights
# GET /zones/{id}/workers/routes, which an account-only token answers with 10000, while a
# REdeploy of an already-attached domain never touches the zone. So the broker entry must
# carry `domains` (zone READ) alongside `scripts`. A lane that redeploys fine and cannot
# make its first attach is exactly the shape this comment exists to stop repeating.
#
# DISPATCH-ONLY, deliberately. A push-triggered deploy of a public read surface would put
# the approval gate on every merge, and the gate is what makes the account-wide
# Workers:Edit mint safe.
#
# THE GATE IS A FACE ID CEREMONY, not a comment (infra#480): the run opens a ceremony
# whose challenge pins THIS run on THIS commit, notifies the approver with the approve
# URL, polls for the authorization, and redeems it — fail closed — before any credential
# is minted. There is NO break-glass (#18, following .github#264 and .github-private#735):
# while the keeper is down this lane does not run. It was an `await-approval` comment gate
# until infra#480, and kept a break_glass fallback to it until #18 removed that too — #235
# established the comment gate cannot tell the dispatcher from the approver, so the fallback
# was a single-boolean bypass to a mechanism known not to work.
on:
  workflow_dispatch:
    inputs:
      provision:
        description: >-
          ONE-SHOT: create the SUBSCRIPTIONS namespace and mint the VAPID keypair before
          deploying (#42). Leave off for an ordinary deploy. Re-running with a keypair
          already configured is refused — a new public key silently invalidates every
          stored subscription.
        type: boolean
        default: false

permissions:
  id-token: write # OIDC → broker /deploy/desk
  contents: write # provisioning pushes the branch that syncs wrangler.jsonc (#42)
  pull-requests: write # ...and opens the PR for it
  issues: write # the manual-approval composite opens/updates the approval issue

# One deploy at a time; never cancel one already in flight.
concurrency:
  group: desk-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: desk-deploy
    timeout-minutes: 60 # bound a forgotten approval — the wait must not hang a runner forever
    steps:
      - name: Refuse to deploy from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::desk deploys only from refs/heads/main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # TRIPWIRE, before the approval and before any credential exists. The board's
      # selection rules and the fail-closed guards are the whole product; shipping a
      # Worker whose wrong-feed guard regressed is worse than not shipping.
      - name: Unit tests (tripwire)
        run: node --test test/*.test.mjs

      # Human authorization BEFORE the mint — no account-wide Workers:Edit token exists until
      # a Face ID has signed THIS run's digest (infra#480; the same shape as keeper-deploy in
      # bounded-systems/infra). The keeper URL is a literal on purpose: a variable here would
      # let configuration move the ceremony somewhere else.
      - name: Open the Face ID ceremony
        id: ceremony
        env:
          KEEPER_URL: https://keeper.bounded.tools
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req="$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '{v:"bounded.deploy-request.v1",repo:"desk",workflow:"deploy.yml",run_id:$run,head_sha:$sha}')"
          start="$(curl -sfS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"requestType\":\"bounded.deploy-request.v1\",\"request\":$req}" \
            "$KEEPER_URL/authorize/start")" || {
            echo "::error::the keeper refused to open a ceremony. There is no break-glass (#18): this lane does not run until keeper.bounded.tools is back."
            exit 1
          }
          ceremony="$(jq -r '.ceremonyId // empty' <<<"$start")"
          approve_url="$(jq -r '.approveUrl // empty' <<<"$start")"
          [ -n "$ceremony" ] && [ -n "$approve_url" ] || { echo "::error::keeper returned no ceremony"; exit 1; }
          echo "ceremony=$ceremony" >> "$GITHUB_OUTPUT"
          echo "request=$req" >> "$GITHUB_OUTPUT"
          # The issue is a NOTIFICATION, not a credential: commenting on it does
          # nothing. The approval is the Face ID at the URL.
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Face ID: approve desk deploy (run ${GITHUB_RUN_ID})" \
            --body "$(printf 'A desk-deploy run wants to mint an account-wide Workers:Edit token and deploy the Front Desk pages at desk/issues/claims/prs.bounded.tools.\n\nApprove with your passkey (15-minute window):\n\n%s\n\nThis issue is a notification only — comments here authorize nothing (infra#480 retired the comment gate). Run: https://github.com/%s/actions/runs/%s' "$approve_url" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "ceremony open — approve at $approve_url"

      - name: Wait for the Face ID, then redeem — fail closed
        env:
          KEEPER_URL: https://keeper.bounded.tools
          CEREMONY: ${{ steps.ceremony.outputs.ceremony }}
          REQ: ${{ steps.ceremony.outputs.request }}
        run: |
          set -euo pipefail
          # Poll until the human approves, the ceremony expires (15 min), or the
          # keeper says GONE. pending/gone being distinct answers is what makes
          # this loop's failure mean "never approved", not "lost a race".
          deadline="$(( $(date +%s) + 900 ))"
          auth=""
          while :; do
            code="$(curl -s --max-time 20 -o /tmp/result.json -w '%{http_code}' "$KEEPER_URL/result?id=${CEREMONY}")" || code=000
            if [ "$code" = "200" ]; then
              if jq -e '.pending' /tmp/result.json >/dev/null 2>&1; then :; else
                auth="$(jq -r '.authorizationId // empty' /tmp/result.json)"
                [ -n "$auth" ] && break
              fi
            elif [ "$code" = "410" ]; then
              echo "::error::the ceremony ended without an authorization: $(jq -r '.error // "gone"' /tmp/result.json 2>/dev/null). Nobody Face ID'd this run."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no Face ID within the 15-minute window — the deploy was not authorized."
              exit 1
            fi
            sleep 10
          done
          redeem="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"authorizationId\":\"$auth\",\"requestType\":\"bounded.deploy-request.v1\",\"request\":$REQ}" \
            "$KEEPER_URL/redeem")"
          person="$(jq -r '.redeemed.person // empty' <<<"$redeem")"
          if [ -z "$person" ]; then
            echo "::error::redemption refused: $(jq -r '.error // "unknown"' <<<"$redeem"). The grant did not match this run's request — failing closed."
            exit 1
          fi
          cred="$(jq -r '.redeemed.credentialId' <<<"$redeem")"
          be="$(jq -r '.redeemed.backupEligible' <<<"$redeem")"
          {
            echo "## Authorized by Face ID"
            echo "- person: \`$person\`"
            echo "- credential: \`$cred\`"
            echo "- backupEligible: \`$be\` (synced passkey ⇒ aal2 — recorded, not assumed away)"
            echo "- request digest bound to run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ authorized by $person (credential $cred)"

      - name: Close the ceremony notification
        if: ${{ steps.ceremony.outputs.issue_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.ceremony.outputs.issue_url }}
        run: gh issue close "$ISSUE_URL" --comment "Authorized by Face ID; ceremony complete." || true


      - name: Mint the deploy token (via OIDC broker /deploy/desk)
        id: token
        env:
          CF_BROKER_URL: ${{ vars.CF_BROKER_URL }}
          DEPLOY_AUDIENCE: cloudflare-workers-deploy-broker
        run: |
          set -euo pipefail
          # ORG variable, deliberately — a repo-level CF_BROKER_URL SHADOWS it, and a stale
          # shadow cost a month of falsely-green runs elsewhere in this org.
          [ -n "${CF_BROKER_URL:-}" ] || { echo "::error::org variable CF_BROKER_URL does not resolve here (do not set a repo-level one — it shadows)"; exit 1; }

          jwt="$(curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DEPLOY_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::could not obtain an OIDC token for ${DEPLOY_AUDIENCE}"; exit 1; }

          body="$(curl -sf -X POST "${CF_BROKER_URL%/}/deploy/desk" -H "Authorization: Bearer $jwt")" || {
            echo "::error::broker refused to mint the deploy token."
            echo "::error::  401 = owner/audience/workflow-ref/environment pin rejected"
            echo "::error::  404 = the broker's LIVE config predates the desk WORKERS_DEPLOY entry —"
            echo "::error::        dispatch broker-deploy in bounded-systems/infra first"
            echo "::error::  500 = broker misconfigured (a declared permission group id is unset)"
            exit 1
          }
          tok="$(jq -r '.token // empty' <<<"$body")"
          [ -n "$tok" ] || { echo "::error::broker returned no token"; exit 1; }
          echo "::add-mask::$tok"

          # Assert we got the intended target's token before using it.
          got_deploy="$(jq -r '.deploy // "?"' <<<"$body")"
          got_script="$(jq -r '.script // "?"' <<<"$body")"
          [ "$got_deploy" = "desk" ] && [ "$got_script" = "bounded-desk" ] || {
            echo "::error::unexpected mint response: deploy=$got_deploy script=$got_script (want desk/bounded-desk)"
            exit 1
          }
          echo "✓ minted Workers:Edit token for deploy=desk"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      # ── PROVISIONING (#42), before the deploy and only when asked ───────────
      #
      # WHY HERE AND NOT IN ITS OWN LANE. It was its own lane (#40) and could
      # not mint: the desk WORKERS_DEPLOY entry pins ONE workflowRef, and it
      # names deploy.yml. That is infra#526's finding — "a workflowRef pins ONE
      # workflow, so each caller needs its own entry" — and the fix is either a
      # second broker entry (an infra PR, a broker deploy, then three more
      # approved runs) or this. Ceremonies are the scarce resource: four lapsed
      # unapproved on 2026-08-30 because each needs a human inside a 15-minute
      # window, so a shape that spends four where one will do is the worse
      # shape however tidy the separation looks.
      #
      # THE COST, STATED: the deployed Worker's config LEADS the repo until the
      # sync PR below merges. #40 avoided that by deploying only after the
      # wiring landed. Traded deliberately — the window is minutes and the same
      # run opens the PR — but it is a trade, and it belongs here rather than in
      # a commit message nobody re-reads.
      - name: Refuse to re-provision over a live keypair
        if: ${{ inputs.provision }}
        run: |
          set -euo pipefail
          # Comments stripped first: wrangler.jsonc DOCUMENTS this key, so a raw
          # grep matches its own documentation and refuses a run that should go.
          if grep -v '^[[:space:]]*//' wrangler.jsonc | grep -q '"VAPID_PUBLIC_KEY"'; then
            echo "::error::a VAPID keypair is already configured. A new public key silently"
            echo "::error::  invalidates every stored subscription — a browser binds each one to"
            echo "::error::  the key it was created with, and there is no two-slot overlap here."
            exit 1
          fi

      - name: Create the SUBSCRIPTIONS namespace (or find it)
        id: kv
        if: ${{ inputs.provision }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          BINDING: SUBSCRIPTIONS
          SCRIPT: bounded-desk
        run: |
          set -euo pipefail
          # IDEMPOTENT BY LOOKUP. A partial earlier run may already have created
          # it, and a SECOND namespace would bind the Worker to an empty store
          # while the real subscriptions sat in the orphan — a failure that reads
          # downstream as "nobody has subscribed".
          #
          # MATCH BOTH TITLE SHAPES, and that is measured rather than assumed.
          # Run 33338834157 created the namespace and then failed to find it:
          # this looked only for "<script>-<BINDING>", the older convention,
          # while wrangler 4 titled it "SUBSCRIPTIONS" flat. Creating a namespace
          # and then reporting it missing is the worst of both — the resource
          # exists, unbound and unnamed by the config. So accept either, rather
          # than pin a vendor naming detail this lane has no reason to know.
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null \
              | jq -r --arg a "$BINDING" --arg b "${SCRIPT}-${BINDING}" \
                  '.[] | select(.title==$a or .title==$b) | .id' | head -1
          }
          id="$(find_id || true)"
          if [ -n "$id" ]; then
            echo "namespace already exists — reusing $id"
          else
            npx --yes wrangler@4 kv namespace create SUBSCRIPTIONS
            id="$(find_id || true)"
          fi
          [ -n "$id" ] || { echo "::error::could not create or find a KV namespace titled \"$BINDING\" or \"${SCRIPT}-${BINDING}\""; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "✓ namespace $id"

      # The private half exists only between these lines: generated here, masked
      # immediately, piped to `secret put`, never written to a file and never
      # echoed. The public half is not a secret — it is served to every visitor
      # inside /notify.js — so it is printed deliberately.
      - name: Generate the VAPID keypair and store the private half
        id: vapid
        if: ${{ inputs.provision }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          keys="$(node -e '
            (async () => {
              const kp = await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"}, true, ["sign"]);
              const raw = new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey));
              const jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
              process.stdout.write(JSON.stringify({pub: Buffer.from(raw).toString("base64url"), priv: jwk.d}));
            })();
          ')"
          priv="$(jq -r .priv <<<"$keys")"
          echo "::add-mask::$priv"
          pub="$(jq -r .pub <<<"$keys")"

          # Shape-check BEFORE storing. A malformed pair fails later as an opaque
          # 401 from every push service at once — indistinguishable from a dead
          # subscription list — so it is caught here, where it is legible.
          node -e '
            const b = s => Buffer.from(s, "base64url");
            const pub = b(process.argv[1]), priv = b(process.argv[2]);
            if (pub.length !== 65 || pub[0] !== 4) throw new Error("public key is not a 65-byte uncompressed P-256 point");
            if (priv.length !== 32) throw new Error("private key is not a 32-byte scalar");
          ' "$pub" "$priv"

          printf '%s' "$priv" | npx --yes wrangler@4 secret put VAPID_PRIVATE_KEY
          echo "pub=$pub" >> "$GITHUB_OUTPUT"
          echo "✓ private half stored as the Worker secret VAPID_PRIVATE_KEY (never printed)"
          echo "public half: $pub"

      - name: Wire the bindings into wrangler.jsonc, so THIS deploy carries them
        if: ${{ inputs.provision }}
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
          VAPID_PUBLIC: ${{ steps.vapid.outputs.pub }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:desk@bounded.tools' }}
        run: |
          set -euo pipefail
          # The transform lives in scripts/, under test — front-desk-projection's
          # rule: one embedded in YAML is one nobody can run, and this decides
          # which store the Worker binds to.
          node scripts/wire-provisioned.mjs wrangler.jsonc

          # VALIDATE THE RESULT, do not re-run the suite. The tripwire before the
          # ceremony already ran all 161 tests on the unwired tree; re-running
          # them here tests nothing new about this deploy and asserts something
          # FALSE — three of them read the real wrangler.jsonc and require it to
          # be unwired, which after the line above it deliberately is not.
          # Run 33339110755 died exactly there, having already minted a keypair.
          #
          # What actually matters before deploying is the postcondition: the file
          # still parses, and carries both bindings.
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const cfg = JSON.parse(raw.split("\n").filter(l => !/^\s*\/\//.test(l)).join("\n"));
            const kv = (cfg.kv_namespaces || []).find(n => n.binding === "SUBSCRIPTIONS");
            if (!kv || !kv.id) throw new Error("SUBSCRIPTIONS binding missing after wiring");
            if (!cfg.vars || !cfg.vars.VAPID_PUBLIC_KEY) throw new Error("VAPID_PUBLIC_KEY missing after wiring");
            if (!cfg.vars.VAPID_SUBJECT) throw new Error("VAPID_SUBJECT missing after wiring");
            if (!cfg.routes || cfg.routes.length !== 4) throw new Error("the four hosts did not survive wiring");
            console.log("✓ wrangler.jsonc parses, binds " + kv.id + ", and keeps all four routes");
          '

      - name: wrangler deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log
          ver="$(sed -n 's/.*[Vv]ersion ID: *\([0-9a-f-]*\).*/\1/p' /tmp/deploy.log | tail -1)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "deployed version ${ver:-<unparsed>}"

      # A SUCCESSFUL `wrangler deploy` IS NOT EVIDENCE THAT THE EDGE SERVES IT. On a first
      # attach the DNS record has to propagate before the host answers at all, so this polls
      # rather than asserting once — and it asserts the page actually renders, not merely
      # that something returned 200. `/healthz` deliberately does NOT touch the feed, so a
      # 200 there with a failing page would be a false green; the pages themselves are what
      # get probed.
      #
      # EVERY HOST IS PROBED, and each one for a marker ONLY THAT HOST CAN PRODUCE (#7).
      # Four hosts on one Worker means a routing mistake serves a reader the wrong page
      # while every URL still answers 200 — probing one host, or probing all four for a
      # shared string, would go green on exactly that bug. `issues` and `claims` are also
      # FIRST ATTACHES, which is the case most likely to fail here and least likely to be
      # reproducible afterwards, so they are probed with the same patience as the rest.
      - name: Read-back probe — does the edge serve each host its own page?
        run: |
          set -euo pipefail
          probe() {
            host="$1"; want="$2"
            deadline=$(( $(date +%s) + 600 ))
            while :; do
              code="$(curl -sS -o "/tmp/probe-${host}.html" -w '%{http_code}' --max-time 20 "https://${host}.bounded.tools/" || echo 000)"
              if [ "$code" = "200" ] && grep -q "$want" "/tmp/probe-${host}.html"; then
                echo "✓ ${host}.bounded.tools serves its own page"
                return 0
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::read-back timed out after 600s: ${host}.bounded.tools answers HTTP ${code} and did not render '${want}'. The wrangler deploy may have succeeded — what this run cannot claim is that this host is SERVING it." >&2
                head -c 400 "/tmp/probe-${host}.html" >&2 || true
                return 1
              fi
              sleep 15
            done
          }
          # The <h1> is the marker: it is exactly what hostname routing decides, and it
          # differs on all four. A stamp line would not — every page prints one.
          probe desk   '<h1>Desk</h1>'
          probe issues '<h1>Issues</h1>'
          probe claims '<h1>Claims</h1>'
          probe prs    '<h1>PRs</h1>'

      # A job cannot finish this job: the namespace id and the public key are not
      # secrets but must land in a COMMITTED file. This PR is what closes the gap
      # the block comment above admits — the deployed Worker leads the repo until
      # it merges, so it is opened by the same run rather than left to a human to
      # remember.
      - name: Open the PR syncing the repo to what was deployed
        if: ${{ inputs.provision }}
        env:
          GH_TOKEN: ${{ github.token }}
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          set -euo pipefail
          branch="provision/vapid-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "desk-deploy"
          git config user.email "desk-deploy@users.noreply.github.com"
          git checkout -b "$branch"
          git add wrangler.jsonc
          git commit -m "$(printf 'desk: wire the subscription store and the VAPID public key (#42)\n\nProvisioned by .github/workflows/deploy.yml run %s, which deployed with these\nvalues already applied — this commit brings the repo up to what is live.\n\nThe private half was generated inside that run, masked, and written straight to\nthe Worker secret VAPID_PRIVATE_KEY. It was never printed and no human has seen\nit.\n\nClaim-issue: bounded-systems/desk#42' "$GITHUB_RUN_ID")"
          git push -u origin "$branch"
          # NOT --draft, and the body says why it may still not merge on its own:
          # GitHub does not trigger workflows from events created by
          # GITHUB_TOKEN, so required checks (pr-claim among them) never run on a
          # PR this lane opens. Run 33339362109's PR sat unmergeable for exactly
          # that reason. The branch and the diff are still the deliverable; a
          # human or a session pushes it the last inch.
          gh pr create --base main --head "$branch" \
            --title "desk: wire the subscription store and the VAPID public key" \
            --body "$(printf 'Opened by `deploy.yml` run %s, which **already deployed** with these values applied.\n\n- KV namespace `%s` bound as `SUBSCRIPTIONS`\n- `VAPID_PUBLIC_KEY` set (the public half — served to every visitor inside `/notify.js`)\n- `VAPID_SUBJECT` set\n\nThe private half was generated inside that run, masked, and written straight to the Worker secret `VAPID_PRIVATE_KEY`. It was never printed and no human has seen it.\n\n**Until this merges the deployed Worker leads the repo.** That is the trade #42 records: folding provisioning into the pinned lane costs three fewer passkey ceremonies and buys this short window of drift.\n\n**Check `VAPID_SUBJECT`** — it is the contact a push service uses if we misbehave.\n\n**Changing `VAPID_PUBLIC_KEY` later invalidates every stored subscription.**\n\n_Note: required checks do not run on a PR opened by GITHUB_TOKEN, so this may need a push from a human or a session to become mergeable (desk#42)._\n\nClaim-issue: bounded-systems/desk#42' "$GITHUB_RUN_ID" "$KV_ID")"
