name: provision

# ONE-SHOT provisioning for Web Push (#39): the KV namespace the subscriptions
# live in, and the VAPID keypair that signs every push.
#
# WHY A LANE AND NOT A LAPTOP. #38's first answer said to run `wrangler`
# locally. That is wrong here, and infra's own records say why: tokens.json
# retired `infra-cf-snapshot-ro` on 2026-07-28 as "superseded by the OIDC
# broker", and the stored-secret fallbacks came out of three workflows the same
# day. So running this by hand does not avoid work — it requires minting a NEW
# standing account-scoped Cloudflare token, which is exactly the credential that
# migration removed. Terraform is not the answer either (infra#545): its lane
# cannot mint at all, apply is a documented workstation operation, and a secret
# in terraform is plaintext in state.
#
# NO HUMAN SEES THE PRIVATE KEY. rotate-lease-key.yml's rule, and its words:
# "generates 32 hex bytes inside the job, masked from the log — no human
# generates or sees plaintext key material". This lane is SIMPLER than that one:
# rotate-lease-key carries an age-encrypted output only for its lagging
# dialog-paste leg, and VAPID has no such leg — the public half is MEANT to be
# published (it is served to every browser inside /notify.js) and nothing
# outside the Worker ever needs the private half. So: no age recipient, no
# custody, no paste. "Custody you don't keep is custody you can't lose."
#
# ONE-SHOT, AND IT REFUSES TO BE OTHERWISE. Re-running must not mint a second
# keypair. A browser binds each subscription to the applicationServerKey it was
# created with, so there is NO two-slot overlap the way rotate-lease-key has —
# a new public key silently invalidates every stored subscription and every
# device stops receiving with no error anywhere. The guard below refuses when a
# key is already configured, and `force` says what it costs.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-provision even though a keypair is already configured. INVALIDATES EVERY EXISTING SUBSCRIPTION — every device must re-subscribe, silently, or it stops receiving."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desk-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: desk-deploy
    timeout-minutes: 60 # bound a forgotten approval — the wait must not hang a runner forever
    permissions:
      id-token: write # OIDC → broker /deploy/desk
      contents: write # push the wiring branch
      pull-requests: write # open the PR that commits the public key + namespace id
      issues: write # the ceremony notification issue
    steps:
      - name: Refuse to provision from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::desk provisions only from refs/heads/main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # THE ONE-SHOT GUARD, before the ceremony — so a run that must not proceed
      # never asks anyone for a Face ID. Asking for an approval and then refusing
      # the work trains the approver that taps are cheap.
      - name: Refuse if a keypair is already configured
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # Comment lines stripped first: wrangler.jsonc DOCUMENTS this very key
          # in the note describing what provisioning will add, so a raw grep
          # matches its own documentation and refuses a run that should proceed.
          if grep -v '^[[:space:]]*//' wrangler.jsonc | grep -q '"VAPID_PUBLIC_KEY"'; then
            if [ "$FORCE" != "true" ]; then
              echo "::error::a VAPID keypair is already configured in wrangler.jsonc."
              echo "::error::  Re-provisioning mints a NEW public key, and a browser binds each"
              echo "::error::  subscription to the key it was created with — so every stored"
              echo "::error::  subscription becomes undeliverable and every device stops receiving"
              echo "::error::  SILENTLY. There is no two-slot overlap here (contrast"
              echo "::error::  infra rotate-lease-key, whose slots are both live)."
              echo "::error::  Re-run with force=true only if that is what you intend."
              exit 1
            fi
            echo "::warning::force=true — every existing subscription will stop receiving."
          fi

      # Human authorization BEFORE the mint. Same shape as deploy.yml; the request
      # literal names THIS workflow, because those strings are what the keeper's
      # approval page renders — a copied block that kept `workflow:"deploy.yml"`
      # would start a ceremony, digest and redeem entirely normally, and the only
      # symptom would be a phone naming the wrong action
      # (front-desk-scheduler#192's finding).
      - name: Open the Face ID ceremony
        id: ceremony
        env:
          KEEPER_URL: https://keeper.bounded.tools
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req="$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '{v:"bounded.deploy-request.v1",repo:"desk",workflow:"provision.yml",run_id:$run,head_sha:$sha}')"
          start="$(curl -sfS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"requestType\":\"bounded.deploy-request.v1\",\"request\":$req}" \
            "$KEEPER_URL/authorize/start")" || {
            echo "::error::the keeper refused to open a ceremony. There is no break-glass (#18): this lane does not run until keeper.bounded.tools is back."
            exit 1
          }
          ceremony="$(jq -r '.ceremonyId // empty' <<<"$start")"
          approve_url="$(jq -r '.approveUrl // empty' <<<"$start")"
          [ -n "$ceremony" ] && [ -n "$approve_url" ] || { echo "::error::keeper returned no ceremony"; exit 1; }
          echo "ceremony=$ceremony" >> "$GITHUB_OUTPUT"
          echo "request=$req" >> "$GITHUB_OUTPUT"
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Face ID: approve desk provisioning (run ${GITHUB_RUN_ID})" \
            --body "$(printf 'A desk provisioning run wants to mint an account-wide Workers:Edit + KV token, CREATE the SUBSCRIPTIONS namespace, and write a new VAPID private key as a Worker secret.\n\nThe private key is generated inside the job and never printed. Only the PUBLIC half and the namespace id leave the run, in a follow-up PR.\n\nApprove with your passkey (15-minute window):\n\n%s\n\nThis issue is a notification only — comments here authorize nothing (infra#480 retired the comment gate). Run: https://github.com/%s/actions/runs/%s' "$approve_url" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "ceremony open — approve at $approve_url"

      - name: Wait for the Face ID, then redeem — fail closed
        env:
          KEEPER_URL: https://keeper.bounded.tools
          CEREMONY: ${{ steps.ceremony.outputs.ceremony }}
          REQ: ${{ steps.ceremony.outputs.request }}
        run: |
          set -euo pipefail
          deadline="$(( $(date +%s) + 900 ))"
          auth=""
          while :; do
            code="$(curl -s --max-time 20 -o /tmp/result.json -w '%{http_code}' "$KEEPER_URL/result?id=${CEREMONY}")" || code=000
            if [ "$code" = "200" ]; then
              if jq -e '.pending' /tmp/result.json >/dev/null 2>&1; then :; else
                auth="$(jq -r '.authorizationId // empty' /tmp/result.json)"
                [ -n "$auth" ] && break
              fi
            elif [ "$code" = "410" ]; then
              echo "::error::the ceremony ended without an authorization: $(jq -r '.error // "gone"' /tmp/result.json 2>/dev/null). Nobody Face ID'd this run."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no Face ID within the 15-minute window — provisioning was not authorized."
              exit 1
            fi
            sleep 10
          done
          redeem="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"authorizationId\":\"$auth\",\"requestType\":\"bounded.deploy-request.v1\",\"request\":$REQ}" \
            "$KEEPER_URL/redeem")"
          person="$(jq -r '.redeemed.person // empty' <<<"$redeem")"
          if [ -z "$person" ]; then
            echo "::error::redemption refused: $(jq -r '.error // "unknown"' <<<"$redeem"). The grant did not match this run's request — failing closed."
            exit 1
          fi
          {
            echo "## Authorized by Face ID"
            echo "- person: \`$person\`"
            echo "- credential: \`$(jq -r '.redeemed.credentialId' <<<"$redeem")\`"
            echo "- request digest bound to run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ authorized by $person"

      - name: Close the ceremony notification
        if: ${{ steps.ceremony.outputs.issue_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.ceremony.outputs.issue_url }}
        run: gh issue close "$ISSUE_URL" --comment "Authorized by Face ID; ceremony complete." || true

      - name: Mint the token (via OIDC broker /deploy/desk)
        id: token
        env:
          CF_BROKER_URL: ${{ vars.CF_BROKER_URL }}
          DEPLOY_AUDIENCE: cloudflare-workers-deploy-broker
        run: |
          set -euo pipefail
          [ -n "${CF_BROKER_URL:-}" ] || { echo "::error::org variable CF_BROKER_URL does not resolve here (do not set a repo-level one — it shadows)"; exit 1; }

          jwt="$(curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DEPLOY_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::could not obtain an OIDC token for ${DEPLOY_AUDIENCE}"; exit 1; }

          body="$(curl -sf -X POST "${CF_BROKER_URL%/}/deploy/desk" -H "Authorization: Bearer $jwt")" || {
            echo "::error::broker refused to mint."
            echo "::error::  401 = owner/audience/workflow-ref/environment pin rejected — note this"
            echo "::error::        lane's ref must be registered too, not just deploy.yml's"
            echo "::error::  404 = the broker's LIVE config predates the desk entry"
            echo "::error::  500 = broker misconfigured (a declared permission group id is unset)"
            exit 1
          }
          tok="$(jq -r '.token // empty' <<<"$body")"
          [ -n "$tok" ] || { echo "::error::broker returned no token"; exit 1; }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"
          echo "✓ minted for deploy=$(jq -r '.deploy // "?"' <<<"$body")"

      # IDEMPOTENT BY LOOKUP, not by hoping. A partial earlier run may already
      # have created the namespace, and creating a SECOND one would leave the
      # Worker bound to an empty store while the real subscriptions sat in the
      # orphan — the failure would look exactly like "nobody has subscribed".
      - name: Create the SUBSCRIPTIONS namespace (or find it)
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          TITLE: bounded-desk-SUBSCRIPTIONS
        run: |
          set -euo pipefail
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null \
              | jq -r --arg t "$TITLE" '.[] | select(.title==$t) | .id' | head -1
          }
          id="$(find_id || true)"
          if [ -n "$id" ]; then
            echo "namespace already exists — reusing $id"
          else
            npx --yes wrangler@4 kv namespace create SUBSCRIPTIONS
            id="$(find_id || true)"
          fi
          [ -n "$id" ] || { echo "::error::could not create or find the $TITLE namespace"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "✓ namespace $id"

      # The private half exists only between these two lines: generated here,
      # masked immediately, piped to `secret put`, never written to a file and
      # never echoed. The public half is not a secret — it is served to every
      # visitor — so it is printed deliberately.
      # The private half exists only between these lines: generated here, masked
      # immediately, piped to `secret put`, never written to a file and never
      # echoed. The public half is not a secret — it is served to every visitor —
      # so it is printed deliberately.
      - name: Generate the VAPID keypair and store the private half
        id: vapid
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          keys="$(node -e '
            (async () => {
              const kp = await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"}, true, ["sign"]);
              const raw = new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey));
              const jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
              process.stdout.write(JSON.stringify({pub: Buffer.from(raw).toString("base64url"), priv: jwk.d}));
            })();
          ')"
          priv="$(jq -r .priv <<<"$keys")"
          echo "::add-mask::$priv"
          pub="$(jq -r .pub <<<"$keys")"

          # Shape-check BEFORE storing. A malformed pair fails later as an opaque
          # 401 from every push service at once, which is indistinguishable from a
          # dead subscription list — so it is caught here, where it is legible.
          node -e '
            const b = s => Buffer.from(s, "base64url");
            const pub = b(process.argv[1]), priv = b(process.argv[2]);
            if (pub.length !== 65 || pub[0] !== 4) throw new Error("public key is not a 65-byte uncompressed P-256 point");
            if (priv.length !== 32) throw new Error("private key is not a 32-byte scalar");
          ' "$pub" "$priv"

          printf '%s' "$priv" | npx --yes wrangler@4 secret put VAPID_PRIVATE_KEY
          echo "pub=$pub" >> "$GITHUB_OUTPUT"
          echo "✓ private half stored as the Worker secret VAPID_PRIVATE_KEY (never printed)"
          echo "public half: $pub"

      # A job cannot finish this job: the namespace id and the public key are not
      # secrets but must land in a COMMITTED file. A PR is the honest close — the
      # binding arrives as a reviewed diff rather than as drift between the
      # deployed Worker and the config that claims to describe it.
      - name: Open the PR that wires them in
        env:
          GH_TOKEN: ${{ github.token }}
          KV_ID: ${{ steps.kv.outputs.id }}
          VAPID_PUBLIC: ${{ steps.vapid.outputs.pub }}
          # The contact a push service reaches if we misbehave. A repo variable
          # rather than a literal, so changing it is a config edit not a code one.
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:desk@bounded.tools' }}
        run: |
          set -euo pipefail
          branch="provision/vapid-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "desk-provision"
          git config user.email "desk-provision@users.noreply.github.com"
          git checkout -b "$branch"

          # The transform lives in scripts/, under test — front-desk-projection's
          # rule, for the same reason: a transform embedded in YAML is one nobody
          # can run, and this one decides which store the Worker is bound to.
          node scripts/wire-provisioned.mjs wrangler.jsonc
          node --test test/*.test.mjs

          git add wrangler.jsonc
          git commit -m "$(printf 'desk: wire the subscription store and the VAPID public key (#39)\n\nGenerated by .github/workflows/provision.yml run %s. The private half was\ngenerated inside that run, masked, and written straight to the Worker secret\nVAPID_PRIVATE_KEY — it was never printed and no human has seen it.\n\nThe public key is not a secret: it is served to every visitor inside\n/notify.js, and it is what each browser binds its subscription to.\n\nClaim-issue: bounded-systems/desk#39' "$GITHUB_RUN_ID")"
          git push -u origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "desk: wire the subscription store and the VAPID public key" \
            --body "$(printf 'Opened by `provision.yml` run %s.\n\n- KV namespace `%s` bound as `SUBSCRIPTIONS`\n- `VAPID_PUBLIC_KEY` set (the public half — served to every visitor inside `/notify.js`)\n- `VAPID_SUBJECT` set\n\nThe private half was generated inside that run, masked, and written straight to the Worker secret `VAPID_PRIVATE_KEY`. It was never printed and no human has seen it.\n\n**Check `VAPID_SUBJECT`** before merging — it is the contact a push service uses if we misbehave.\n\n**Changing `VAPID_PUBLIC_KEY` later invalidates every stored subscription** — a browser binds each one to the key it was created with, and there is no two-slot overlap here.\n\nAfter this merges and deploys, `/subscribe` and `/notify` stop answering 503.\n\nClaim-issue: bounded-systems/desk#39' "$GITHUB_RUN_ID" "$KV_ID")"
